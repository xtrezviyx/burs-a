<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БУРСА — Рево — Скутер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            background-image:
                radial-gradient(ellipse at top, rgba(180, 30, 30, 0.25), transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(30, 60, 180, 0.2), transparent 55%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.015) 2px,
                    rgba(255, 255, 255, 0.015) 3px
                );
            color: #e8e8ec;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 820px;
            width: 100%;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(200, 40, 40, 0.6), transparent 40%, transparent 60%, rgba(40, 100, 200, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
        }

        .card {
            position: relative;
            background: rgba(15, 15, 22, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 60px 50px 55px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(220, 40, 40, 0.08), transparent 30%);
            animation: rotate 12s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(3.2rem, 12vw, 6.5rem);
            letter-spacing: 0.14em;
            text-align: center;
            text-transform: uppercase;
            line-height: 0.95;
            background: linear-gradient(180deg, #ffffff 0%, #ff4040 55%, #a01010 100%);
            -webkit-background-clip: text;
                    background-clip: text;
            -webkit-text-fill-color: transparent;
                    color: transparent;
            filter: drop-shadow(0 6px 24px rgba(220, 40, 40, 0.35));
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            font-size: clamp(0.75rem, 2.4vw, 1.05rem);
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: #8a8aa0;
            margin-bottom: 45px;
            padding-left: 0.55em;
            position: relative;
            z-index: 1;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 45px;
            position: relative;
            z-index: 1;
        }

        .divider .line {
            height: 1px;
            width: 70px;
            background: linear-gradient(90deg, transparent, #ff4040);
        }

        .divider .line.right {
            background: linear-gradient(90deg, #ff4040, transparent);
        }

        .divider .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff4040;
            box-shadow: 0 0 14px 3px rgba(255, 64, 64, 0.7);
        }

        p {
            font-size: clamp(1rem, 2.4vw, 1.2rem);
            line-height: 1.95;
            text-align: center;
            color: #c8c8d4;
            font-weight: 300;
            letter-spacing: 0.01em;
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
        }

        .word {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: inline-block;
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: default;
        }

        .w1 {
            color: #ff4d4d;
            text-shadow: 0 0 22px rgba(255, 77, 77, 0.45);
        }

        .w2 {
            color: #ffb340;
            text-shadow: 0 0 22px rgba(255, 179, 64, 0.4);
        }

        .w3 {
            color: #4da6ff;
            text-shadow: 0 0 22px rgba(77, 166, 255, 0.45);
        }

        .word:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #4a4a5e;
            position: relative;
            z-index: 1;
        }

        .footer span {
            color: #ff4040;
        }

        @media (max-width: 600px) {
            .card {
                padding: 45px 24px 40px;
            }
            .subtitle {
                letter-spacing: 0.35em;
                padding-left: 0.35em;
            }
            p {
                line-height: 1.85;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Бурса</h1>
            <div class="subtitle">Рево &nbsp;·&nbsp; Скутер</div>

            <div class="divider">
                <span class="line"></span>
                <span class="dot"></span>
                <span class="line right"></span>
            </div>

            <p>
                <span class="word w1">Бурса</span>, блять,
                <span class="word w2">Рево</span>, блять, нахуй, і, сука,
                <span class="word w3">скутер</span>, блять, —
                це, блять, нахуй, сука, блять, всього, блять, три, блять, слова, блять, нахуй,
                але, сука, в них, блять, поміщається, блять, нахуй, все, сука, твоє, блять, життя, блять!
            </p>

            <div class="footer">
                <span>■</span> &nbsp; три слова &nbsp; <span>■</span>
            </div>
        </div>
    </div>
</body>
</html>
